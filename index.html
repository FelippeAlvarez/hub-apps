<title>Central de Aplicativos · Felippe Alvarez</title>
<meta name="description" content="Central pessoal de aplicativos de Felippe Alvarez.">
<meta name="theme-color" content="#0a0d14">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Central de Aplicativos">
<meta property="og:description" content="Acesso reservado.">

<meta property="og:image:width" content="1200">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --bg2:#0f1420; --ink:#ece9e1; --mute:#8d93a3; --dim:#5b6274;
  --gold:#c8a96a; --gold2:#e6cf9b; --line:rgba(200,169,106,.16);
  --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;overflow-x:hidden;
  background-image:
   radial-gradient(900px 500px at 85% -10%,rgba(200,169,106,.13),transparent 60%),
   radial-gradient(700px 500px at -10% 30%,rgba(70,110,190,.12),transparent 60%),
   radial-gradient(600px 400px at 60% 110%,rgba(200,169,106,.07),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 22px 40px}

/* ---------- Gate ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(700px 500px at 50% 30%,rgba(200,169,106,.12),transparent 65%),var(--bg)}
.gate-card{width:100%;max-width:400px;text-align:center;padding:42px 32px 34px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.monogram{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:.04em;color:var(--gold2);
  border:1px solid rgba(200,169,106,.45);background:radial-gradient(circle at 30% 25%,rgba(200,169,106,.22),rgba(200,169,106,.03));
  box-shadow:0 0 40px rgba(200,169,106,.18)}
.gate-card h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.01em}
.gate-card p{color:var(--mute);font-size:13.5px;margin:8px 0 26px;line-height:1.5}
.field{position:relative}
.field input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;font-size:16px;text-align:center;letter-spacing:.12em;outline:none;transition:.2s}
.field input:focus{border-color:rgba(200,169,106,.6);box-shadow:0 0 0 4px rgba(200,169,106,.1)}
.btn-gold{width:100%;margin-top:14px;padding:14px;border-radius:12px;font-weight:600;font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;color:#1a1408;
  background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 8px 24px rgba(200,169,106,.25);transition:.2s}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(200,169,106,.32)}
.btn-gold[disabled]{opacity:.6;cursor:wait}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:12.5px;color:var(--mute);cursor:pointer;user-select:none}
.remember input{accent-color:#c8a96a}
.err{min-height:18px;margin-top:12px;font-size:13px;color:#e58f8f}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Header ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand .monogram{width:42px;height:42px;margin:0;font-size:18px;box-shadow:none}
.brand b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.top-actions{display:flex;gap:8px}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--mute);font-size:13px;transition:.2s}
.ghost:hover{color:var(--gold2);border-color:rgba(200,169,106,.5)}

/* ---------- Hero ---------- */
.hero{padding:54px 0 34px;animation:rise .8s .05s both}
.eyebrow{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.hero h2{font-family:var(--serif);font-weight:500;font-size:clamp(38px,6.4vw,68px);line-height:1.04;margin:14px 0 14px;letter-spacing:-.005em}
.hero h2 em{font-style:italic;color:var(--gold2)}
.hero p{color:var(--mute);max-width:560px;line-height:1.6;font-size:15.5px}
.stats{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--gold2);font-weight:600}
.stat span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0 26px;animation:rise .8s .12s both}
.search{flex:1 1 280px;position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:1.7}
.search input{width:100%;padding:14px 48px 14px 44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:15px;outline:none;transition:.2s}
.search input:focus{border-color:rgba(200,169,106,.55);background:var(--glass2);box-shadow:0 0 0 4px rgba(200,169,106,.08)}
.search kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:11px var(--sans);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mute);transition:.2s;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{color:#1a1408;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;font-weight:600}

/* ---------- Sections / cards ---------- */
.sec-title{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.sec-title h3{font-family:var(--serif);font-size:25px;font-weight:600}
.sec-title span{font-size:12px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:18px;min-height:178px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .6s both}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at var(--mx,100%) var(--my,0%),rgba(200,169,106,.16),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:rgba(200,169,106,.5);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card:hover::before{opacity:1}
.card.off{opacity:.78}
.card.off:hover{transform:none;border-color:var(--line);box-shadow:none}
.card.off:hover::before{opacity:0}
.c-head{display:flex;align-items:center;justify-content:space-between}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(200,169,106,.1);border:1px solid rgba(200,169,106,.25)}
.ico svg{width:23px;height:23px;stroke:var(--gold2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.card h4{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15}
.card p{color:var(--mute);font-size:13.5px;line-height:1.55;flex:1}
.c-foot{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.open{display:inline-flex;align-items:center;gap:7px;color:var(--gold2);font-weight:500}
.open svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.card:hover .open svg{transform:translate(3px,-3px)}
.soft{color:var(--dim)}
.gh{position:relative;z-index:2;color:var(--dim);font-size:12px;border-bottom:1px dotted var(--dim)}
.gh:hover{color:var(--gold2)}
.stretch{position:absolute;inset:0;z-index:1}
.empty{padding:50px 0;text-align:center;color:var(--dim)}

/* ---------- Footer / dialog ---------- */
footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;color:var(--dim);font-size:12.5px}
footer nav{display:flex;gap:6px 18px;flex-wrap:wrap}
footer button{color:var(--mute);font-size:12.5px}
footer button:hover{color:var(--gold2)}
dialog{margin:auto;width:min(680px,calc(100% - 28px));max-height:86vh;border:1px solid var(--line);border-radius:20px;color:var(--ink);padding:0;
  background:linear-gradient(180deg,#141a28,#0d111b);box-shadow:0 40px 100px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(3,5,10,.7);backdrop-filter:blur(4px)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.d-head h3{font-family:var(--serif);font-size:26px;font-weight:600}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:18px}
.tabs{display:flex;gap:4px;padding:14px 18px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px;border-radius:10px;font-size:13px;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--gold2);background:rgba(200,169,106,.1)}
.d-body{padding:18px 24px 26px;overflow:auto;max-height:58vh;font-size:14px;line-height:1.7;color:#c9ccd6}
.d-body h5{font-family:var(--serif);font-size:19px;color:var(--ink);margin:14px 0 4px;font-weight:600}
.d-body h5:first-child{margin-top:0}
.d-body ul{padding-left:20px}
.pend{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;color:#e6cf9b;border:1px dashed rgba(200,169,106,.5)}
#app{display:none}
@media (max-width:560px){
  .hero{padding-top:34px}
  .stats{gap:22px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .search kbd{display:none}
  .sec-title span{display:none}
  .sec-title h3{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Porta de acesso -->
<div id="gate">
  <form class="gate-card" id="gform" autocomplete="off">
    <div class="monogram">FA</div>
    <h1>Central de Aplicativos</h1>
    <p>Acesso reservado.<br>Informe a senha para continuar.</p>
    <div class="field"><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" autofocus aria-label="Senha"></div>
    <button class="btn-gold" id="gbtn" type="submit">Entrar</button>
    <label class="remember"><input type="checkbox" id="rem"> Lembrar neste aparelho</label>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app">
 <div class="wrap">
  <header class="top">
    <div class="brand"><div class="monogram">FA</div><div><b>Central de Aplicativos</b><small>Felippe Alvarez</small></div></div>
    <div class="top-actions">
      <button class="ghost" data-info="manual">Manual</button>
      <button class="ghost" id="lock">Sair</button>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow" id="greet">Bem-vindo</div>
    <h2>Todos os seus aplicativos,<br><em>num só lugar.</em></h2>
    <p>Acesso rápido a cada ferramenta, organizadas por área de atuação.</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar aplicativo…" aria-label="Buscar aplicativo"><kbd>/</kbd>
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div id="recent"></div>
  <div id="list"></div>

  <footer>
    <span>© <span id="yr"></span> Felippe Alvarez. Todos os direitos reservados.</span>
    <nav>
      <button data-info="sobre">Sobre</button>
      <button data-info="manual">Manual de uso</button>
      <button data-info="licencas">Licenças</button>
      <button data-info="termos">Termos de uso</button>
      <button data-info="privacidade">Privacidade</button>
      <button data-info="creditos">Créditos</button>
    </nav>
  </footer>
 </div>
</div>

<dialog id="dlg">
  <div class="d-head"><h3 id="dtitle"></h3><button class="x" id="dclose" aria-label="Fechar">×</button></div>
  <div class="tabs" id="dtabs"></div>
  <div class="d-body" id="dbody"></div>
</dialog>

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:210000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
let DATA=null, cat="all", term="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

async function tryUnlock(pw,remember){
  try{ DATA=await decrypt(pw); }catch(e){ return false; }
  if(remember) store.set("hub.pw",pw); else sess.set("hub.pw",pw);
  $("#gate").style.display="none"; $("#app").style.display="block"; start(); return true;
}
$("#gform").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#gbtn"); b.disabled=true; b.textContent="Verificando…"; $("#err").textContent="";
  const ok=await tryUnlock($("#pw").value,$("#rem").checked);
  b.disabled=false; b.textContent="Entrar";
  if(!ok){ $("#err").textContent="Senha incorreta."; const c=$(".gate-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); $("#pw").select(); }
});
$("#lock").onclick=()=>{store.del("hub.pw");sess.del("hub.pw");location.reload()};
(async()=>{ const p=store.get("hub.pw")||sess.get("hub.pw"); if(p&&!(await tryUnlock(p,!!store.get("hub.pw")))){store.del("hub.pw");sess.del("hub.pw")} })();

function start(){
  const h=new Date().getHours(); $("#greet").textContent=(h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+", Felippe";
  $("#yr").textContent=new Date().getFullYear();
  const apps=DATA.apps, on=apps.filter(a=>a.url).length;
  $("#stats").innerHTML=`<div class="stat"><b>${apps.length}</b><span>Aplicativos</span></div><div class="stat"><b>${on}</b><span>Com acesso direto</span></div><div class="stat"><b>${Object.keys(CATS).length-1}</b><span>Áreas</span></div>`;
  $("#chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip${k===cat?" on":""}" data-cat="${k}">${v.n}</button>`).join("");
  $("#chips").onclick=e=>{const b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));render()};
  $("#q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
  addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&!$("#dlg").open){e.preventDefault();$("#q").focus()}});
  render();
}
const ARROW='<svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>';
function card(a,i){
  const c=CATS[a.cat], live=!!a.url;
  return `<article class="card${live?"":" off"}" style="animation-delay:${Math.min(i,12)*45}ms" data-id="${a.id}">
    ${live?`<a class="stretch" href="${esc(a.url)}" target="_blank" rel="noopener" data-open="${a.id}" aria-label="Abrir ${esc(a.name)}"></a>`:""}
    <div class="c-head"><div class="ico"><svg viewBox="0 0 24 24">${c.i}</svg></div><span class="tag">${esc(a.tag||"")}</span></div>
    <div><h4>${esc(a.name)}</h4></div>
    <p>${esc(a.desc)}${a.note?` <span class="soft">${esc(a.note)}</span>`:""}</p>
    <div class="c-foot">${live?`<span class="open">Abrir ${ARROW}</span>`:`<span class="soft">Uso local</span>`}<a class="gh" href="${esc(a.repo)}" target="_blank" rel="noopener">GitHub</a></div>
  </article>`;
}
function render(){
  const apps=DATA.apps.filter(a=>(cat==="all"||a.cat===cat)&&(!term||(a.name+" "+a.desc+" "+CATS[a.cat].n).toLowerCase().includes(term)));
  const rec=JSON.parse(store.get("hub.recent")||"[]").map(id=>DATA.apps.find(a=>a.id===id&&a.url)).filter(Boolean).slice(0,4);
  $("#recent").innerHTML=(!term&&cat==="all"&&rec.length)?`<div class="sec-title"><h3>Recentes</h3><span>últimos abertos</span></div><div class="grid">${rec.map(card).join("")}</div>`:"";
  let html="", n=0;
  if(!apps.length) html='<div class="empty">Nenhum aplicativo encontrado.</div>';
  else for(const k of Object.keys(CATS).filter(k=>k!=="all")){
    const g=apps.filter(a=>a.cat===k); if(!g.length)continue;
    html+=`<div class="sec-title"><h3>${CATS[k].n}</h3><span>${CATS[k].t}</span></div><div class="grid">${g.map(a=>card(a,n++)).join("")}</div>`;
  }
  $("#list").innerHTML=html;
}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){const id=o.dataset.open;let r=JSON.parse(store.get("hub.recent")||"[]").filter(x=>x!==id);r.unshift(id);store.set("hub.recent",JSON.stringify(r.slice(0,8)));setTimeout(render,300)}
  const i=e.target.closest("[data-info]"); if(i) openInfo(i.dataset.info);
});
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
function openInfo(k){
  const dlg=$("#dlg");
  $("#dtitle").textContent="Central de Aplicativos";
  $("#dtabs").innerHTML=Object.entries(INFO).map(([id,v])=>`<button class="tab${id===k?" on":""}" data-tab="${id}">${v[0]}</button>`).join("");
  $("#dbody").innerHTML=INFO[k][1]();
  if(!dlg.open) dlg.showModal();
}
$("#dtabs").onclick=e=>{const t=e.target.closest("[data-tab]");if(!t)return;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));$("#dbody").innerHTML=INFO[t.dataset.tab][1]();$("#dbody").scrollTop=0};
$("#dclose").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
