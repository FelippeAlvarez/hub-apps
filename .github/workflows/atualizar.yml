name: Atualizar Central de Aplicativos

on:
  schedule:
    - cron: '0 9 * * *'   # todos os dias, 06h no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]
    paths: ['template.html', 'scripts/**', 'data/**', 'static/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar a Central de Aplicativos
        run: node scripts/build.mjs
        env:
          HUB_READ_TOKEN: ${{ secrets.HUB_READ_TOKEN }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
